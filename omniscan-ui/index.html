<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OmniScan</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ionic App" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Apply the saved theme before first paint (no light flash). Mirrors src/utils/themeStorage.ts -->
    <script>
      (function () {
        var dark = false;
        try {
          var stored = localStorage.getItem('omniscan_dark_mode');
          if (stored === 'true') dark = true;
          else if (stored === 'false') dark = false;
          else dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {}
        var root = document.documentElement;
        root.classList.toggle('ion-palette-dark', dark);
        root.classList.toggle('dark', dark);
        document.addEventListener('DOMContentLoaded', function () {
          document.body.classList.toggle('dark', dark);
        });
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>

</html>
